version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

# O PostgreSQL não está aqui pois o servidor já existe.
# Configurar DATABASE_URL no .env apontando para o servidor existente.
# Em produção o frontend (porta 3000) faz proxy de /api para o api (porta 8000).
# Para desenvolvimento local, use docker-compose.override.yml com volume e --reload.
